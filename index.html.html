<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Follow-Up Tracker</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Follow-Ups">
<meta name="theme-color" content="#1565C0">
<style>
  * { box-sizing: border-box; }
  body, div, button, input, select, textarea { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  #app { max-width: 460px; margin: 0 auto; background: #F4F6F8; min-height: 100vh; padding-bottom: 70px; position: relative; }
  .header { background: #1565C0; color: #fff; padding: 16px 16px; display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-size: 20px; font-weight: 600; margin: 0; }
  .header button { background: none; border: none; color: #fff; padding: 4px; cursor: pointer; }
  .bell-wrap { position: relative; }
  .badge { position: absolute; top: -4px; right: -4px; background: #D32F2F; color: #fff; font-size: 10px; font-weight: 700; border-radius: 10px; min-width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; padding: 0 3px; }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 14px 12px 0; }
  .tile { border-radius: 8px; padding: 10px 4px; text-align: center; cursor: pointer; border: none; }
  .tile .num { font-size: 22px; font-weight: 700; display: block; margin-top: 2px; }
  .tile .lbl { font-size: 10.5px; font-weight: 600; }
  .tile-due { background: #FFE9CC; } .tile-due .lbl { color: #7A3E00; } .tile-due .num { color: #F57C00; }
  .tile-overdue { background: #FBDADA; } .tile-overdue .lbl { color: #7A1414; } .tile-overdue .num { color: #D32F2F; }
  .tile-inactive { background: #E6E6E6; } .tile-inactive .lbl { color: #3A3A3A; } .tile-inactive .num { color: #616161; }
  .tile-all { background: #D6E8FB; } .tile-all .lbl { color: #0D3D6B; } .tile-all .num { color: #1565C0; }
  .add-btn { display: block; width: calc(100% - 24px); margin: 12px auto 0; background: #2E7D32; color: #fff; border: none; border-radius: 8px; padding: 13px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .section-title { padding: 16px 16px 8px; font-size: 17px; font-weight: 700; color: #1A1A1A; }
  .filter-tabs { display: flex; gap: 8px; padding: 0 16px 10px; }
  .filter-tab { flex: 1; text-align: center; padding: 9px 0; border-radius: 8px; background: #E9E9E9; color: #444; font-size: 14px; font-weight: 600; border: none; cursor: pointer; }
  .filter-tab.active { background: #D32F2F; color: #fff; }
  .filter-tab.active.due { background: #F57C00; }
  .filter-tab.active.inactive { background: #616161; }
  .list { padding: 0 12px; }
  .card { background: #fff; border-radius: 10px; padding: 14px; margin-bottom: 10px; border: 1px solid #E5E7EB; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .card-name { color: #1565C0; font-weight: 700; font-size: 16px; margin: 0; cursor: pointer; }
  .card-sub { color: #6B7280; font-size: 13px; margin: 2px 0 8px; }
  .tag { font-size: 11px; font-weight: 700; color: #fff; border-radius: 6px; padding: 4px 9px; white-space: nowrap; }
  .tag-overdue { background: #D32F2F; } .tag-due { background: #F57C00; } .tag-upcoming { background: #2E7D32; } .tag-inactive { background: #616161; }
  .hr { border: none; border-top: 1px solid #EEE; margin: 8px 0; }
  .row { display: flex; justify-content: space-between; align-items: center; font-size: 13.5px; color: #1A1A1A; margin: 3px 0; }
  .row .val { font-weight: 700; }
  .red { color: #D32F2F; } .green { color: #2E7D32; } .amber { color: #F57C00; }
  .notes-row { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #444; margin-top: 8px; }
  .icon-btns { display: flex; gap: 10px; }
  .icon-btn { width: 32px; height: 32px; border-radius: 50%; background: #E8F0FE; display: flex; align-items: center; justify-content: center; color: #1565C0; text-decoration: none; }
  .empty { text-align: center; padding: 40px 20px; color: #888; font-size: 14px; }
  .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 460px; background: #fff; border-top: 1px solid #E5E7EB; display: flex; justify-content: space-around; padding: 8px 0 10px; }
  .nav-btn { background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 2px; color: #888; cursor: pointer; position: relative; }
  .nav-btn.active { color: #1565C0; }
  .nav-label { font-size: 10px; font-weight: 600; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: flex-end; z-index: 50; }
  .sheet { background: #fff; width: 100%; max-width: 460px; margin: 0 auto; border-radius: 16px 16px 0 0; padding: 18px; max-height: 88vh; overflow-y: auto; }
  .sheet h2 { margin: 0 0 14px; font-size: 18px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; color: #444; margin-bottom: 4px; }
  .field input, .field select, .field textarea { width: 100%; padding: 10px; border: 1px solid #D1D5DB; border-radius: 8px; font-size: 14px; }
  .field textarea { resize: none; height: 60px; }
  .err { color: #D32F2F; font-size: 12px; margin-top: 3px; }
  .sheet-actions { display: flex; gap: 10px; margin-top: 16px; }
  .btn-secondary { flex: 1; background: #F1F1F1; border: none; border-radius: 8px; padding: 12px; font-weight: 600; cursor: pointer; }
  .btn-primary { flex: 1; background: #1565C0; color: #fff; border: none; border-radius: 8px; padding: 12px; font-weight: 600; cursor: pointer; }
  .btn-danger { background: #D32F2F; color: #fff; }
  .settings-item { background: #fff; border: 1px solid #E5E7EB; border-radius: 10px; padding: 14px; margin: 0 16px 10px; display: flex; justify-content: space-between; align-items: center; }
/* Hide Tiiny Host promotional banner */
#tiiny-host-banner, 
div[id*="tiiny"], 
div[class*="tiiny"], 
iframe[src*="tiiny"] {
  display: none !important;
  opacity: 0 !important;
  visibility: hidden !important;
  pointer-events: none !important;
}

/* Ensure the app content leaves room for bottom navigation */
#app {
  padding-bottom: 90px !important;
</style>
</head>
<body>


<div id="app"></div>

<script>
(function(){
  var STORAGE_KEY = 'followup_leads_v1';
  var leads = [];
  var mainTab = 'leads';
  var filterTab = 'overdue';
  var showForm = false;
  var editId = null;
  var formError = '';
  var loaded = false;

  var svgIcons = {
    menu: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>',
    bell: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>',
    phone: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
    mail: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M22 6l-10 7L2 6"/></svg>',
    person: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
    plus: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
    gear: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
    trash: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>',
    note: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>'
  };

  function todayStr(){ var d = new Date(); return d.toISOString().slice(0,10); }
  function daysBetween(a, b){ return Math.round((new Date(a) - new Date(b)) / 86400000); }
  function fmtDate(s){ var d = new Date(s+'T00:00:00'); return d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}); }

  function derive(lead){
    var today = todayStr();
    var daysUntil = daysBetween(lead.nextFollowUp, today);
    var daysSinceLast = lead.lastFollowUp ? daysBetween(today, lead.lastFollowUp) : 0;
    var autoInactive = lead.lastFollowUp && daysSinceLast > 30;
    var isInactive = lead.inactive === true || (lead.inactive !== false && autoInactive);
    var status;
    if (isInactive) status = 'inactive';
    else if (daysUntil < 0) status = 'overdue';
    else if (daysUntil === 0) status = 'due';
    else status = 'upcoming';
    return { daysUntil: daysUntil, status: status, daysLate: Math.abs(daysUntil) };
  }

  function seed(){
    return [
      {id: 'l1', name: 'John Williams', company: 'XYZ Corp', dealStatus: 'Proposal Sent', phone: '5550101', email: 'john@xyzcorp.com', lastFollowUp: '2026-08-20', nextFollowUp: '2026-08-30', notes: 'Call to discuss proposal', inactive: null},
      {id: 'l2', name: 'Priya Sharma', company: 'ABC Ltd.', dealStatus: 'Demo Pending', phone: '5550102', email: 'priya@abcltd.com', lastFollowUp: '2026-09-01', nextFollowUp: '2026-09-10', notes: 'Schedule product demo', inactive: null},
      {id: 'l3', name: 'Michael Rao', company: 'Global Tech', dealStatus: 'Quote Sent', phone: '5550103', email: 'michael@globaltech.com', lastFollowUp: '2026-09-05', nextFollowUp: todayStr(), notes: 'Follow up on quotation', inactive: null},
      {id: 'l4', name: 'Sarah Lee', company: 'Nova Inc.', dealStatus: 'Contract Review', phone: '5550104', email: 'sarah@novainc.com', lastFollowUp: '2026-09-08', nextFollowUp: '2026-09-20', notes: 'Send updated contract', inactive: null},
      {id: 'l5', name: 'Tom Becker', company: 'Delta Co.', dealStatus: 'Cold Lead', phone: '5550105', email: 'tom@deltaco.com', lastFollowUp: '2026-07-01', nextFollowUp: '2026-07-15', notes: 'No response in weeks', inactive: null}
    ];
  }

  function loadData(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      leads = raw ? JSON.parse(raw) : seed();
    } catch(e) {
      leads = seed();
    }
    if (!leads || leads.length === 0) leads = seed();
    loaded = true;
    saveData();
    render();
  }

  function saveData(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(leads)); }
    catch(e) { console.error('save failed', e); }
  }

  function counts(){
    var due=0, overdue=0, inactive=0;
    leads.forEach(function(l){
      var d = derive(l);
      if (d.status === 'overdue') overdue++;
      else if (d.status === 'due') due++;
      else if (d.status === 'inactive') inactive++;
    });
    return { due: due, overdue: overdue, inactive: inactive, all: leads.length };
  }

  function setTab(t){ mainTab = t; render(); }
  function setFilter(t){ filterTab = t; render(); }

  function openForm(id){
    editId = id || null;
    formError = '';
    showForm = true;
    render();
  }
  function closeForm(){ showForm = false; editId = null; formError = ''; render(); }

  function submitForm(e){
    e.preventDefault();
    var f = e.target;
    var name = f.name.value.trim();
    var company = f.company.value.trim();
    var nextDate = f.nextFollowUp.value;
    if (!name || !nextDate) {
      formError = 'Name and next follow-up date are required.';
      render();
      return;
    }
    var data = {
      name: name,
      company: company,
      dealStatus: f.dealStatus.value.trim(),
      phone: f.phone.value.trim(),
      email: f.email.value.trim(),
      lastFollowUp: f.lastFollowUp.value || todayStr(),
      nextFollowUp: nextDate,
      notes: f.notes.value.trim(),
      inactive: f.markInactive.checked ? true : null
    };
    if (editId) {
      leads = leads.map(function(l){ return l.id === editId ? Object.assign({}, l, data) : l; });
    } else {
      data.id = 'l' + Date.now();
      leads.push(data);
    }
    saveData();
    showForm = false; editId = null;
    render();
  }

  function deleteLead(id){
    leads = leads.filter(function(l){ return l.id !== id; });
    saveData();
    render();
  }

  async function clearAll(){
    leads = seed();
    saveData();
    render();
  }

  function esc(s){
    var d = document.createElement('div');
    d.innerText = s == null ? '' : s;
    return d.innerHTML;
  }

  function renderCard(lead){
    var d = derive(lead);
    var tagClass = 'tag-' + (d.status === 'due' ? 'due' : d.status);
    var tagLabel = d.status === 'overdue' ? 'Overdue' : d.status === 'due' ? 'Due today' : d.status === 'inactive' ? 'Inactive' : 'Upcoming';
    var nextLine;
    if (d.status === 'overdue') nextLine = '<span class="red val">'+fmtDate(lead.nextFollowUp)+' ('+d.daysLate+' days late)</span>';
    else if (d.status === 'due') nextLine = '<span class="amber val">'+fmtDate(lead.nextFollowUp)+' (today)</span>';
    else nextLine = '<span class="green val">'+fmtDate(lead.nextFollowUp)+'</span>';
    return '' +
    '<div class="card">' +
      '<div class="card-top">' +
        '<div>' +
          '<p class="card-name" onclick="app.openForm(\''+lead.id+'\')">'+esc(lead.name)+'</p>' +
          '<p class="card-sub">'+esc(lead.company)+(lead.dealStatus ? ' | '+esc(lead.dealStatus) : '')+'</p>' +
        '</div>' +
        '<span class="tag '+tagClass+'">'+tagLabel+'</span>' +
      '</div>' +
      '<div class="hr"></div>' +
      (lead.lastFollowUp ? '<div class="row"><span>Last follow-up</span><span class="val">'+fmtDate(lead.lastFollowUp)+'</span></div>' : '') +
      '<div class="row"><span>Next follow-up</span>'+nextLine+'</div>' +
      (lead.notes ? '<div class="notes-row">'+svgIcons.note+' '+esc(lead.notes)+'</div>' : '') +
      '<div class="hr"></div>' +
      '<div style="display:flex; justify-content:space-between; align-items:center;">' +
        '<div class="icon-btns">' +
          '<a class="icon-btn" href="tel:'+esc(lead.phone)+'" aria-label="Call">'+svgIcons.phone+'</a>' +
          '<a class="icon-btn" href="mailto:'+esc(lead.email)+'" aria-label="Email">'+svgIcons.mail+'</a>' +
        '</div>' +
        '<button class="icon-btn" style="background:#FBDADA;color:#D32F2F;" onclick="app.deleteLead(\''+lead.id+'\')" aria-label="Delete">'+svgIcons.trash+'</button>' +
      '</div>' +
    '</div>';
  }

  function renderLeadsScreen(){
    var c = counts();
    var filtered = leads.filter(function(l){ return derive(l).status === (filterTab === 'due' ? 'due' : filterTab) || (filterTab === 'due' && derive(l).status === 'upcoming'); });
    var listHtml = filtered.length ? filtered.map(renderCard).join('') : '<div class="empty">No leads in this view.</div>';
    return '' +
    '<div class="tiles">' +
      '<button class="tile tile-due" onclick="app.setFilter(\'due\')"><span class="lbl">Due today</span><span class="num">'+c.due+'</span></button>' +
      '<button class="tile tile-overdue" onclick="app.setFilter(\'overdue\')"><span class="lbl">Overdue</span><span class="num">'+c.overdue+'</span></button>' +
      '<button class="tile tile-inactive" onclick="app.setFilter(\'inactive\')"><span class="lbl">Inactive</span><span class="num">'+c.inactive+'</span></button>' +
      '<button class="tile tile-all" onclick="app.setFilter(\'all\')"><span class="lbl">All leads</span><span class="num">'+c.all+'</span></button>' +
    '</div>' +
    '<button class="add-btn" onclick="app.openForm()">+ Add follow-up</button>' +
    '<div class="section-title">Leads to follow up</div>' +
    '<div class="filter-tabs">' +
      '<button class="filter-tab due '+(filterTab==='due'?'active':'')+'" onclick="app.setFilter(\'due\')">Due</button>' +
      '<button class="filter-tab '+(filterTab==='overdue'?'active':'')+'" onclick="app.setFilter(\'overdue\')">Overdue</button>' +
      '<button class="filter-tab inactive '+(filterTab==='inactive'?'active':'')+'" onclick="app.setFilter(\'inactive\')">Inactive</button>' +
    '</div>' +
    '<div class="list">'+listHtml+'</div>';
  }

  function renderNotifications(){
    var items = leads.filter(function(l){ var s = derive(l).status; return s === 'overdue' || s === 'due'; });
    var html = items.length ? items.map(renderCard).join('') : '<div class="empty">Nothing due right now.</div>';
    return '<div class="section-title">Reminders</div><div class="list">'+html+'</div>';
  }

  function renderSettings(){
    return '' +
    '<div class="section-title">Settings</div>' +
    '<div class="settings-item"><span>Total leads stored</span><b>'+leads.length+'</b></div>' +
    '<div class="settings-item"><span>Reset to sample data</span>' +
      '<button class="btn-primary btn-danger" style="flex:none;padding:8px 14px;" onclick="app.confirmClear()">Reset</button>' +
    '</div>';
  }

  function renderForm(){
    var lead = editId ? leads.find(function(l){ return l.id === editId; }) : null;
    var v = lead || {};
    return '' +
    '<div class="overlay" onclick="if(event.target===this) app.closeForm()">' +
      '<div class="sheet">' +
        '<h2>'+(lead ? 'Edit follow-up' : 'Add follow-up')+'</h2>' +
        '<form onsubmit="app.submitForm(event)">' +
          '<div class="field"><label>Name</label><input name="name" value="'+esc(v.name)+'" placeholder="Full name"></div>' +
          '<div class="field"><label>Company</label><input name="company" value="'+esc(v.company)+'" placeholder="Company name"></div>' +
          '<div class="field"><label>Deal status</label><input name="dealStatus" value="'+esc(v.dealStatus)+'" placeholder="e.g. Proposal sent"></div>' +
          '<div class="field"><label>Phone</label><input name="phone" value="'+esc(v.phone)+'" placeholder="5551234567"></div>' +
          '<div class="field"><label>Email</label><input name="email" type="email" value="'+esc(v.email)+'" placeholder="name@company.com"></div>' +
          '<div class="field"><label>Last follow-up date</label><input name="lastFollowUp" type="date" value="'+(v.lastFollowUp||'')+'"></div>' +
          '<div class="field"><label>Next follow-up date</label><input name="nextFollowUp" type="date" value="'+(v.nextFollowUp||'')+'"></div>' +
          '<div class="field"><label>Notes / task</label><textarea name="notes" placeholder="What needs to happen next">'+esc(v.notes)+'</textarea></div>' +
          '<div class="field" style="display:flex;align-items:center;gap:8px;"><input type="checkbox" name="markInactive" id="mi" style="width:auto;" '+(v.inactive===true?'checked':'')+'><label for="mi" style="margin:0;">Mark as inactive</label></div>' +
          (formError ? '<div class="err">'+esc(formError)+'</div>' : '') +
          '<div class="sheet-actions">' +
            '<button type="button" class="btn-secondary" onclick="app.closeForm()">Cancel</button>' +
            '<button type="submit" class="btn-primary">Save</button>' +
          '</div>' +
        '</form>' +
      '</div>' +
    '</div>';
  }

  function render(){
    if (!loaded) {
      document.getElementById('app').innerHTML = '<div style="padding:40px;text-align:center;color:#888;">Loading...</div>';
      return;
    }
    var c = counts();
    var body = mainTab === 'leads' ? renderLeadsScreen() : mainTab === 'notifications' ? renderNotifications() : renderSettings();
    var html = '' +
    '<div class="header">' +
      '<button aria-label="Menu">'+svgIcons.menu+'</button>' +
      '<h1>Follow-Up Tracker</h1>' +
      '<button class="bell-wrap" onclick="app.setTab(\'notifications\')" aria-label="Notifications">'+svgIcons.bell+(c.due+c.overdue>0 ? '<span class="badge">'+(c.due+c.overdue)+'</span>' : '')+'</button>' +
    '</div>' +
    body +
    '<div class="bottom-nav">' +
      '<button class="nav-btn '+(mainTab==='leads'?'active':'')+'" onclick="app.setTab(\'leads\')">'+svgIcons.person+'<span class="nav-label">Leads</span></button>' +
      '<button class="nav-btn" onclick="app.openForm()">'+svgIcons.plus+'<span class="nav-label">Add</span></button>' +
      '<button class="nav-btn '+(mainTab==='notifications'?'active':'')+'" onclick="app.setTab(\'notifications\')">'+svgIcons.bell+'<span class="nav-label">Alerts</span></button>' +
      '<button class="nav-btn '+(mainTab==='settings'?'active':'')+'" onclick="app.setTab(\'settings\')">'+svgIcons.gear+'<span class="nav-label">Settings</span></button>' +
    '</div>' +
    (showForm ? renderForm() : '');
    document.getElementById('app').innerHTML = html;
  }

  window.app = {
    setTab: setTab, setFilter: setFilter, openForm: openForm, closeForm: closeForm,
    submitForm: submitForm, deleteLead: deleteLead,
    confirmClear: function(){ if (confirm('Reset all data back to sample leads? This deletes everything you added.')) clearAll(); }
  };

  loadData();
})();
</script>
